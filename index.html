<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Наёмник — фокус-дневник</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --paper: #f4ecda; --card: #fbf6ea; --ink: #33302a; --ink-soft: #7a7264;
  --accent: #a63d2f; --gold: #d9a441; --ok: #5d7a45;
  --shadow: 0 2px 0 rgba(51,48,42,.25);
  --font-hand: 'Caveat', cursive; --font-ui: 'Nunito', system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font-ui); color: var(--ink); min-height: 100vh;
  background: radial-gradient(1000px 500px at 85% -10%, #fff6dd 0%, transparent 60%), var(--paper); }
.app { max-width: 960px; margin: 0 auto; padding: 0 16px 64px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 0; }
.topbar nav { margin-left: auto; display: flex; gap: 8px; }
.coins { font-weight: 800; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; box-shadow: var(--shadow); }
.btn { font: inherit; font-weight: 800; color: var(--ink); background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer; box-shadow: var(--shadow); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--gold); }
.btn.on { background: var(--ink); color: var(--paper); }
.btn.danger { background: #f4d7cf; }
.btn.ghost { background: transparent; border-color: transparent; box-shadow: none; color: var(--ink-soft); font-weight: 700; }
.btn.del { padding: 2px 9px; color: var(--accent); }
.hand { font-family: var(--font-hand); font-size: 1.7rem; margin: 0; }
.screen { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.paper { background: var(--card); border: 2px solid var(--ink); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; }
.invrow { display: flex; gap: 8px; font-size: 26px; }
.stats { font-weight: 800; }
.ritual { width: min(420px, 100%); display: flex; flex-direction: column; gap: 10px; }
.checkrow { display: flex; align-items: center; gap: 6px; }
.check { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; flex: 1; }
.check input { width: 20px; height: 20px; accent-color: var(--ok); }
#rit-new { font: inherit; background: #fffdf6; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; flex: 1; min-width: 0; }
input[type=range] { width: 100%; height: 28px; accent-color: var(--accent); cursor: pointer; }
.notes { display: grid; grid-template-columns: repeat(2, minmax(240px, 1fr)); gap: 18px; width: min(720px, 100%); }
.note { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; padding: 14px; }
.note .icon { font-size: 30px; } .note .title { font-size: 1.5rem; }
.note.r0 { transform: rotate(-1.2deg); } .note.r1 { transform: rotate(1deg); }
.note.r2 { transform: rotate(.8deg); } .note.r3 { transform: rotate(-.7deg); }
.note:disabled { opacity: .55; }
.stamp { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-soft); }
.stamp.active { color: var(--accent); } .stamp.done { color: var(--ok); }
.cover { border-style: dashed; color: var(--ink-soft); font-weight: 700; }
.modal { position: fixed; inset: 0; background: rgba(43,33,20,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.dialog { width: min(480px, 100%); display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow: auto; }
.dialog.pop { animation: pop .25s ease-out; }
@keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }
.field { display: flex; flex-direction: column; gap: 6px; font-weight: 700; }
.field input:not([type=range]), #f-steps input { font: inherit; background: #fffdf6; border: 2px solid var(--ink); border-radius: 8px; padding: 8px 10px; }
#f-steps { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.rowlabel { font-weight: 800; margin-right: 4px; }
.chip { font: inherit; font-weight: 700; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.chip.on { background: var(--ink); color: var(--paper); }
.reward { font-weight: 800; }
.placeholder { color: var(--ink-soft); font-weight: 700; border-style: dashed; }
.focuscard { width: min(480px, 100%); display: flex; flex-direction: column; gap: 12px; }
.focushead { display: flex; align-items: center; gap: 10px; }
.timer { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; text-align: center; }
.timer.low { color: var(--accent); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
.pausebox { display: flex; flex-direction: column; gap: 8px; width: 100%; }
.flow-on { background: #d9ead1; color: var(--ok); border-color: var(--ok); }
.hero-svg { animation: bob 3s ease-in-out infinite; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.shopgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; width: min(720px, 100%); }
.shopitem { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px; }
.shopitem .icon { font-size: 30px; } .shopitem .name { font-weight: 700; }
.shopitem:disabled { opacity: .55; }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const ARCHETYPES = {
  gathering: { title: 'Собрать травы', icon: '🌿' },
  fight:     { title: 'Перебить слаймов', icon: '⚔️' },
  escort:    { title: 'Сопроводить обоз', icon: '🛡️' },
  search:    { title: 'Найти кошку', icon: '🔍' },
};
const EVENTS = {
  gathering: '🌿 Ты заметил новое место для сбора! Как урожай — на каком ты шаге?',
  fight: '⚔️ Слаймы огрызаются! Время хила: выдохни, разомнись — и обратно в бой.',
  escort: '🛡️ Привал! Обоз встал на минуту — попей воды и продолжай путь.',
  search: '🔍 Ты перешёл на новое место. Осмотрись: как продвигаются поиски?',
};
const SHOP = [
  { id: 'mug',     name: 'Кружка наёмника',   type: 'home', price: 40,  icon: '🍵' },
  { id: 'plant',   name: 'Растение в горшке', type: 'home', price: 50,  icon: '🪴' },
  { id: 'scarf',   name: 'Красный шарф',      type: 'char', price: 60,  icon: '🧣' },
  { id: 'map',     name: 'Карта на стену',    type: 'home', price: 70,  icon: '🗺️' },
  { id: 'hat',     name: 'Шляпа следопыта',   type: 'char', price: 80,  icon: '🎩' },
  { id: 'garland', name: 'Гирлянда',          type: 'home', price: 90,  icon: '🎇' },
  { id: 'shield',  name: 'Щит стража',        type: 'char', price: 100, icon: '🛡️' },
  { id: 'sword',   name: 'Новый меч',         type: 'char', price: 120, icon: '🗡️' },
];
const KEY = 'merc-focus-save-v1';
const today = () => new Date().toISOString().slice(0, 10);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtMS = ms => {
  const s = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  const mm = String(m).padStart(2, '0'), ss = String(sec).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
};
const fmtClock = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const fmtDur = min => min < 60 ? min + ' мин' : (min % 60 === 0 ? (min / 60) + ' ч' : Math.floor(min / 60) + ' ч ' + (min % 60) + ' мин');
const FROZEN = Infinity;

// ---------- ЗВУК ----------
let audioCtx = null;
function beep(freq, dur, type, gain) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = gain;
    o.connect(g); g.connect(audioCtx.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  coin()  { beep(880,.14,'square',.22); setTimeout(()=>beep(1320,.18,'square',.22), 130); },
  event() { beep(660,.22,'sine',.22); },
  pause() { beep(440,.22,'sine',.22); },
  done()  { [523,660,880,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'triangle',.22), i*140)); },
};

// ---------- ПЕРСОНАЖ ----------
function heroSVG(mood, size) {
  const faces = {
    sleepy: `<path d="M40 52 q6 6 12 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <path d="M68 52 q6 6 12 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="60" cy="67" r="3" fill="#33302a"/>
      <text x="96" y="28" font-size="16" fill="#7a7264" font-family="Caveat">z</text>
      <text x="106" y="16" font-size="12" fill="#7a7264" font-family="Caveat">z</text>`,
    awake: `<circle cx="46" cy="52" r="3.5" fill="#33302a"/><circle cx="74" cy="52" r="3.5" fill="#33302a"/>
      <path d="M52 64 q8 7 16 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>`,
    happy: `<path d="M40 54 q6 -7 12 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <path d="M68 54 q6 -7 12 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <path d="M50 63 q10 12 20 0" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>`,
    work: `<path d="M40 51 h12" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <path d="M68 51 h12" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
      <path d="M54 66 h12" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>`,
  };
  return `<svg class="hero-svg" viewBox="0 0 120 140" width="${size || 140}" aria-hidden="true">
    <ellipse cx="60" cy="106" rx="34" ry="28" fill="#8a5a33" stroke="#33302a" stroke-width="3"/>
    <rect x="28" y="104" width="64" height="9" fill="#5b3a1e"/>
    <rect x="53" y="101" width="14" height="14" fill="#d9a441" stroke="#33302a" stroke-width="2"/>
    <path d="M26 84 Q60 98 94 84 L94 94 Q60 108 26 94 Z" fill="#a63d2f" stroke="#33302a" stroke-width="3"/>
    <circle cx="60" cy="50" r="34" fill="#fdf6e8" stroke="#33302a" stroke-width="3"/>
    <path d="M50 18 Q60 8 68 20" fill="none" stroke="#33302a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="38" cy="60" r="5" fill="#f3b8a8"/><circle cx="82" cy="60" r="5" fill="#f3b8a8"/>
    ${faces[mood] || faces.awake}
  </svg>`;
}

// ---------- СОСТОЯНИЕ ----------
function initialState() {
  return {
    player: { coins: 0, inventory: [], completed: 0, focusMin: 0, days: 1 },
    day: { date: today() },
    ritualItems: [],
    ritualSeq: 1,
    board: { gathering: 'available', fight: 'available', escort: 'available', search: 'available' },
    activeQuest: null,
  };
}
function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return initialState();
    const s = JSON.parse(raw);
    // миграция старого ритуала-объекта в редактируемый список
    if (!Array.isArray(s.ritualItems)) {
      const old = (s.day && s.day.ritual) || {};
      const texts = { shower: 'Душ', teeth: 'Зубы', breakfast: 'Завтрак / стакан воды' };
      s.ritualItems = Object.keys(texts).filter(k => k in old)
        .map((k, i) => ({ id: i + 1, text: texts[k], done: !!old[k] }));
      s.ritualSeq = s.ritualItems.length + 1;
    }
    if (s.ritualSeq == null) s.ritualSeq = s.ritualItems.reduce((m, i) => Math.max(m, i.id), 0) + 1;
    if (s.day.date !== today()) {
      s.day = { date: today() };
      s.ritualItems.forEach(i => { i.done = false; });
      Object.keys(s.board).forEach(a => { if (s.board[a] === 'done') s.board[a] = 'available'; });
      s.player.days = (s.player.days || 1) + 1;
    }
    const q = s.activeQuest;
    if (q) {
      if (q.pausedAt == null && q.pausedUntil != null) q.pausedAt = Date.now();
      if (q.nextEventAt === undefined)
        q.nextEventAt = (!q.flowMode && q.reminderMin > 0) ? Date.now() + q.reminderMin * 60000 : null;
    }
    return s;
  } catch { return initialState(); }
}
let state = loadState();
let screen = 'home';
const saveState = () => localStorage.setItem(KEY, JSON.stringify(state));
const ritualDone = () => state.ritualItems.length > 0 && state.ritualItems.every(i => i.done);

const isHalted = q => q.pausedAt != null;
const isPaused = q => q.pausedUntil != null && q.pausedUntil !== FROZEN;
const isFrozen = q => q.pausedUntil === FROZEN;
const questRemaining = q => isHalted(q) ? q.endsAt - q.pausedAt : q.endsAt - Date.now();

// ---------- DOM ----------
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const overlay = html => { const m = el(`<div class="modal">${html}</div>`); document.body.appendChild(m); return m; };
const modalOpen = () => !!document.querySelector('.modal');
function chipGroup(box, options, get, set, fmt) {
  const draw = () => {
    box.innerHTML = '';
    options.forEach(v => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (v === get() ? ' on' : '');
      b.textContent = fmt(v);
      b.onclick = () => { set(v); draw(); };
      box.appendChild(b);
    });
  };
  draw();
}

// ---------- ЭКРАНЫ ----------
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  if (screen !== 'focus') app.appendChild(renderTopbar());
  if (screen === 'home') app.appendChild(renderHome());
  if (screen === 'board') app.appendChild(renderBoard());
  if (screen === 'shop') app.appendChild(renderShop());
  if (screen === 'focus') app.appendChild(renderFocus());
}

function renderTopbar() {
  const unlocked = ritualDone() || state.activeQuest;
  const bar = el(`<header class="topbar">
    <span class="coins">🪙 ${state.player.coins}</span>
    <nav>
      <button class="btn ${screen==='home'?'on':''}" data-nav="home">Дом</button>
      <button class="btn ${screen==='board'?'on':''}" data-nav="board" ${unlocked?'':'disabled'}>Доска</button>
      <button class="btn ${screen==='shop'?'on':''}" data-nav="shop">Магазин</button>
    </nav>
  </header>`);
  bar.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { screen = b.dataset.nav; render(); });
  return bar;
}

function renderHome() {
  const done = ritualDone();
  const items = state.ritualItems;
  const inv = state.player.inventory.map(id => SHOP.find(x => x.id === id)).filter(Boolean);
  const charRow = inv.filter(i => i.type === 'char').map(i => `<span>${i.icon}</span>`).join('');
  const homeRow = inv.filter(i => i.type === 'home').map(i => `<span>${i.icon}</span>`).join('');
  const p = state.player;
  const wrap = el(`<main class="screen">
    ${heroSVG(done ? 'awake' : 'sleepy', 150)}
    ${charRow ? `<div class="invrow">${charRow}</div>` : ''}
    <div class="paper stats">📜 контрактов: ${p.completed} · ⏱ минут: ${p.focusMin} · 🌅 дней: ${p.days}</div>
    <section class="paper ritual">
      <h2 class="hand">Утренний ритуал</h2>
      ${items.length ? '' : '<div class="placeholder">Пока пусто — добавь первый пункт ниже 👇</div>'}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${items.map(it => `<div class="checkrow">
          <label class="check"><input type="checkbox" data-rit="${it.id}" ${it.done ? 'checked' : ''}><span>${esc(it.text)}</span></label>
          <button class="btn ghost del" data-del="${it.id}" title="Удалить пункт">✕</button>
        </div>`).join('')}
      </div>
      <div class="row">
        <input id="rit-new" placeholder="Новый пункт рутины…">
        <button class="btn" id="rit-add" disabled>+ Добавить</button>
      </div>
    </section>
    ${homeRow ? `<div class="invrow">${homeRow}</div>` : ''}
    <button class="btn primary" data-go ${done ? '' : 'disabled'}>${done ? 'К доске объявлений →' : '🔒 Сначала утренний ритуал'}</button>
  </main>`);
  wrap.querySelectorAll('[data-rit]').forEach(cb => cb.onchange = () => {
    const it = items.find(x => x.id == cb.dataset.rit);
    if (it) { it.done = cb.checked; saveState(); render(); }
  });
  wrap.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    state.ritualItems = state.ritualItems.filter(x => x.id != b.dataset.del);
    saveState(); render();
  });
  const newInput = wrap.querySelector('#rit-new');
  const addBtn = wrap.querySelector('#rit-add');
  newInput.oninput = () => { addBtn.disabled = !newInput.value.trim(); };
  const add = () => {
    const text = newInput.value.trim();
    if (!text) return;
    state.ritualItems.push({ id: state.ritualSeq++, text, done: false });
    saveState(); render();
    const ni = document.querySelector('#rit-new');
    if (ni) ni.focus();
  };
  addBtn.onclick = add;
  newInput.onkeydown = e => { if (e.key === 'Enter') add(); };
  wrap.querySelector('[data-go]').onclick = () => { screen = 'board'; render(); };
  return wrap;
}

function renderBoard() {
  const done = ritualDone();
  const cover = !done
    ? (state.ritualItems.length
        ? '<div class="paper cover">Наёмник ещё не привёл себя в порядок 🪥</div>'
        : '<div class="paper cover">Ритуал пуст — собери его в Доме 🏠</div>')
    : (state.activeQuest ? '<div class="paper cover">Сначала заверши текущий контракт 📜</div>' : '');
  const wrap = el(`<main class="screen">
    <h2 class="hand">Доска объявлений</h2>
    ${cover}
    <div class="notes">
      ${Object.entries(ARCHETYPES).map(([a, info], i) => {
        const st = state.board[a];
        const clickable = st === 'active' || (st === 'available' && done && !state.activeQuest);
        const stamp = st === 'done' ? '✓ выполнено' : st === 'active' ? 'в работе' : 'доступно';
        return `<button class="note paper r${i % 4}" data-quest="${a}" ${clickable ? '' : 'disabled'}>
          <span class="icon">${info.icon}</span>
          <span class="title hand">${info.title}</span>
          <span class="stamp ${st}">${stamp}</span>
        </button>`;
      }).join('')}
    </div>
  </main>`);
  wrap.querySelectorAll('[data-quest]').forEach(btn => btn.onclick = () => {
    const a = btn.dataset.quest;
    if (state.board[a] === 'active') { screen = 'focus'; render(); }
    else if (!state.activeQuest) openForm(a);
  });
  return wrap;
}

function openForm(archetype) {
  const info = ARCHETYPES[archetype];
  const steps = ['', ''];
  let duration = 60, reminder = 10;
  const modal = overlay(`<div class="paper dialog">
    <h3 class="hand">${info.icon} ${info.title}</h3>
    <label class="field">Суть в реальности<input id="f-essence" placeholder="например, помыть посуду"></label>
    <div class="field"><span>Шаги (минимум 2)</span><div id="f-steps"></div></div>
    <button class="chip" id="f-add" type="button">+ шаг</button>
    <label class="field"><span>Время задачи: <b id="f-dur-label"></b></span>
      <input type="range" id="f-dur" min="30" max="720" step="30" value="60"></label>
    <label class="field"><span>События-напоминания: <b id="f-rem-label"></b></span>
      <input type="range" id="f-rem" min="5" max="30" step="5" value="10"></label>
    <div class="reward" id="f-reward"></div>
    <div class="row">
      <button class="btn primary" id="f-accept" type="button" disabled>Принять контракт</button>
      <button class="btn" id="f-cancel" type="button">Отмена</button>
    </div>
  </div>`);
  const essenceInput = modal.querySelector('#f-essence');
  const stepsBox = modal.querySelector('#f-steps');
  const rewardEl = modal.querySelector('#f-reward');
  const acceptBtn = modal.querySelector('#f-accept');
  const durInput = modal.querySelector('#f-dur');
  const remInput = modal.querySelector('#f-rem');
  const durLabel = modal.querySelector('#f-dur-label');
  const remLabel = modal.querySelector('#f-rem-label');

  function syncSliders() {
    duration = +durInput.value;
    reminder = +remInput.value;
    durLabel.textContent = fmtDur(duration);
    remLabel.textContent = 'каждые ' + reminder + ' мин';
  }
  durInput.oninput = syncSliders;
  remInput.oninput = syncSliders;

  function renderSteps() {
    stepsBox.innerHTML = '';
    steps.forEach((s, i) => {
      const inp = document.createElement('input');
      inp.placeholder = 'Шаг ' + (i + 1);
      inp.value = s;
      inp.oninput = () => { steps[i] = inp.value; refresh(); };
      stepsBox.appendChild(inp);
    });
    modal.querySelector('#f-add').style.display = steps.length < 6 ? '' : 'none';
  }
  function refresh() {
    const valid = essenceInput.value.trim() && steps[0] && steps[0].trim() && steps[1] && steps[1].trim();
    rewardEl.textContent = 'Награда: 🪙 ' + (20 + steps.filter(s => s && s.trim()).length * 2);
    acceptBtn.disabled = !valid;
  }
  essenceInput.oninput = refresh;
  modal.querySelector('#f-add').onclick = () => { steps.push(''); renderSteps(); refresh(); };
  modal.querySelector('#f-cancel').onclick = () => modal.remove();
  acceptBtn.onclick = () => {
    const now = Date.now();
    state.activeQuest = {
      archetype,
      essence: essenceInput.value.trim(),
      steps: steps.filter(s => s && s.trim()).map(t => ({ text: t.trim(), done: false })),
      durationMin: duration, reminderMin: reminder,
      endsAt: now + duration * 60000,
      pausedAt: null, pausedUntil: null,
      nextEventAt: now + reminder * 60000,
      endShown: false, flowMode: false,
    };
    state.board[archetype] = 'active';
    saveState(); modal.remove(); screen = 'focus'; render();
  };
  renderSteps(); refresh(); syncSliders();
}

function renderFocus() {
  const q = state.activeQuest;
  if (!q) { screen = 'home'; return renderHome(); }
  const info = ARCHETYPES[q.archetype];
  const pauseLabel = isPaused(q) ? `⏸ Пауза до ${fmtClock(q.pausedUntil)}` : '❄ Заморожено';
  const pauseBlock = isHalted(q) ? `<div class="paper cover pausebox">${pauseLabel}
    <div class="row">
      <button class="btn primary" id="pz-go">Продолжить сейчас</button>
      ${isPaused(q) ? '<button class="btn" id="pz-ext">Продлить</button>' : ''}
    </div></div>` : '';

  const wrap = el(`<main class="screen"><div class="paper focuscard">
    <div class="focushead">${heroSVG('work', 64)}<h3 class="hand">${info.icon} ${info.title}</h3></div>
    <p style="margin:0"><b>Реальность:</b> ${esc(q.essence)}</p>
    <div class="timer" id="timer">--:--</div>
    <div id="stepbox" class="ritual" style="width:100%"></div>
    ${pauseBlock}
    <div class="row">
      <button class="btn" id="f-pause" ${isHalted(q) ? 'disabled' : ''}>Пауза</button>
      <button class="btn ${q.flowMode ? 'flow-on' : ''}" id="f-flow" ${q.flowMode ? 'disabled' : ''}>${q.flowMode ? '🎯 в потоке' : '🎯 Словил фикс'}</button>
      <button class="btn danger" id="f-drop">Бросить контракт</button>
    </div>
  </div></main>`);
  const box = wrap.querySelector('#stepbox');
  q.steps.forEach(s => {
    const lab = el(`<label class="check"><input type="checkbox" ${s.done ? 'checked' : ''}><span>${esc(s.text)}</span></label>`);
    lab.querySelector('input').onchange = e => {
      s.done = e.target.checked; saveState();
      if (q.steps.every(x => x.done)) completeQuest();
    };
    box.appendChild(lab);
  });
  wrap.querySelector('#f-pause').onclick = () => openPauseForm(true);
  wrap.querySelector('#f-flow').onclick = () => { q.flowMode = true; q.nextEventAt = null; saveState(); render(); };
  wrap.querySelector('#f-drop').onclick = () => confirmDrop();
  if (isHalted(q)) {
    wrap.querySelector('#pz-go').onclick = () => { resumeQuest(); render(); };
    const ext = wrap.querySelector('#pz-ext');
    if (ext) ext.onclick = () => openPauseForm(false);
  }
  return wrap;
}

function renderShop() {
  const wrap = el(`<main class="screen">
    <h2 class="hand">Лавка торговца</h2>
    <div class="coins">🪙 ${state.player.coins}</div>
    <div class="shopgrid">
      ${SHOP.map(it => {
        const owned = state.player.inventory.includes(it.id);
        const afford = state.player.coins >= it.price;
        return `<button class="paper shopitem" data-item="${it.id}" ${owned || !afford ? 'disabled' : ''}>
          <span class="icon">${it.icon}</span>
          <span class="name">${it.name}</span>
          <span class="stamp ${owned ? 'done' : ''}">${owned ? '✓ куплено' : '🪙 ' + it.price}</span>
        </button>`;
      }).join('')}
    </div>
  </main>`);
  wrap.querySelectorAll('[data-item]').forEach(b => b.onclick = () => {
    const it = SHOP.find(x => x.id === b.dataset.item);
    if (!it || state.player.inventory.includes(it.id) || state.player.coins < it.price) return;
    state.player.coins -= it.price;
    state.player.inventory.push(it.id);
    saveState(); sfx.coin(); render();
  });
  return wrap;
}

// ---------- ЛОГИКА ВРЕМЕНИ ----------
function freezeNow() {
  const q = state.activeQuest; if (!q || isHalted(q)) return;
  q.pausedAt = Date.now();
  q.pausedUntil = FROZEN;
  saveState();
}
function resumeQuest() {
  const q = state.activeQuest; if (!q) return;
  if (q.pausedAt != null) q.endsAt += Date.now() - q.pausedAt;
  q.pausedAt = null; q.pausedUntil = null;
  q.nextEventAt = (!q.flowMode && q.reminderMin > 0) ? Date.now() + q.reminderMin * 60000 : null;
  saveState();
}
function openPauseForm(fromRunning) {
  const q = state.activeQuest; if (!q) return;
  if (fromRunning) freezeNow();
  let dur = null;
  const m = overlay(`<div class="paper dialog">
    <h3 class="hand">Привал</h3>
    <p style="margin:0">На сколько встаём? (обязательно)</p>
    <div class="row" id="p-chips"></div>
    <div class="row">
      <button class="btn primary" id="p-ok" disabled>Встать на привал</button>
      <button class="btn" id="p-cancel">Отмена</button>
    </div>
  </div>`);
  const okBtn = m.querySelector('#p-ok');
  chipGroup(m.querySelector('#p-chips'), [5,10,15,30], () => dur, v => { dur = v; okBtn.disabled = false; }, x => x + 'м');
  m.querySelector('#p-cancel').onclick = () => {
    m.remove();
    if (fromRunning) { resumeQuest(); render(); }
  };
  okBtn.onclick = () => {
    q.pausedUntil = Date.now() + dur * 60000;
    saveState(); sfx.pause();
    try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {}
    m.remove(); render();
  };
}
function confirmDrop() {
  const q = state.activeQuest; if (!q) return;
  const doneSteps = q.steps.filter(s => s.done).length;
  const m = overlay(`<div class="paper dialog">
    <h3 class="hand">Бросить контракт?</h3>
    <p style="margin:0">Монеты за отмеченные шаги (${doneSteps} × 2 = 🪙 ${doneSteps * 2}) останутся у тебя.</p>
    <div class="row">
      <button class="btn danger" id="s-yes">Бросить</button>
      <button class="btn" id="s-no">Остаться</button>
    </div>
  </div>`);
  m.querySelector('#s-yes').onclick = () => { m.remove(); drop(); };
  m.querySelector('#s-no').onclick = () => m.remove();
}
function drop() {
  const q = state.activeQuest; if (!q) return;
  state.player.coins += q.steps.filter(s => s.done).length * 2;
  state.board[q.archetype] = 'available';
  state.activeQuest = null;
  saveState(); screen = 'board'; render();
}
function completeQuest() {
  const q = state.activeQuest; if (!q) return;
  const stepCoins = q.steps.length * 2, bonus = 20;
  state.player.coins += stepCoins + bonus;
  state.player.completed += 1;
  state.player.focusMin += q.durationMin;
  state.board[q.archetype] = 'done';
  state.activeQuest = null;
  saveState(); sfx.done();
  const m = overlay(`<div class="paper dialog pop" style="text-align:center">
    <h3 class="hand">🪙 Контракт выполнен!</h3>
    <p style="margin:0">+${stepCoins} за шаги · +${bonus} за завершение</p>
    <div class="row" style="justify-content:center">
      <button class="btn primary" id="r-shop">В магазин</button>
      <button class="btn" id="r-board">К доске</button>
      <button class="btn" id="r-home">Домой</button>
    </div>
  </div>`);
  m.querySelector('#r-shop').onclick = () => { m.remove(); screen = 'shop'; render(); };
  m.querySelector('#r-board').onclick = () => { m.remove(); screen = 'board'; render(); };
  m.querySelector('#r-home').onclick = () => { m.remove(); screen = 'home'; render(); };
}

// ---------- СОБЫТИЯ ----------
function openEvent() {
  const q = state.activeQuest; if (!q) return;
  freezeNow(); sfx.event();
  const m = overlay(`<div class="paper dialog pop">
    <h3 class="hand">Событие в пути</h3>
    <p style="margin:0">${EVENTS[q.archetype]}</p>
    <div class="row">
      <button class="btn primary" id="ev-go">Продолжаю приключение</button>
    </div>
  </div>`);
  m.querySelector('#ev-go').onclick = () => { m.remove(); resumeQuest(); render(); };
}
function openTimeUp() {
  freezeNow(); sfx.event();
  const m = overlay(`<div class="paper dialog pop">
    <h3 class="hand">⏰ Время вышло!</h3>
    <p style="margin:0">На сколько продлить контракт?</p>
    <div class="row" id="t-chips"></div>
  </div>`);
  chipGroup(m.querySelector('#t-chips'), [5,10,15,30], () => null, v => {
    const q = state.activeQuest;
    if (q) {
      q.endsAt = Date.now() + v * 60000;
      q.pausedAt = null; q.pausedUntil = null;
      q.endShown = false;
      q.nextEventAt = (!q.flowMode && q.reminderMin > 0) ? Date.now() + q.reminderMin * 60000 : null;
      saveState();
    }
    m.remove(); render();
  }, x => '+' + x + ' мин');
}
function openPauseExpired() {
  sfx.pause();
  try {
    if ('Notification' in window && Notification.permission === 'granted')
      new Notification('Привал окончен!', { body: 'Наёмник, контракт ждёт.' });
  } catch (e) {}
  const m = overlay(`<div class="paper dialog pop">
    <h3 class="hand">⏰ Привал окончен</h3>
    <p style="margin:0">Пауза закончилась. Возвращаемся к контракту?</p>
    <div class="row">
      <button class="btn primary" id="x-go">Продолжить</button>
      <button class="btn" id="x-ext">Продлить</button>
      <button class="btn danger" id="x-drop">Бросить контракт</button>
    </div>
  </div>`);
  m.querySelector('#x-go').onclick = () => { m.remove(); resumeQuest(); render(); };
  m.querySelector('#x-ext').onclick = () => { m.remove(); openPauseForm(false); };
  m.querySelector('#x-drop').onclick = () => { m.remove(); drop(); };
}

// ---------- ТИКЕР ----------
setInterval(() => {
  const q = state.activeQuest;
  if (!q || screen !== 'focus') return;
  const now = Date.now();
  const tEl = document.getElementById('timer');
  if (tEl) {
    const rem = questRemaining(q);
    if (isHalted(q)) {
      tEl.textContent = (isFrozen(q) ? '❄ ' : '⏸ ') + fmtMS(rem);
      tEl.classList.remove('low');
    } else {
      tEl.textContent = fmtMS(rem);
      tEl.classList.toggle('low', rem <= 60000 && rem > 0);
    }
  }
  if (modalOpen()) return;
  if (isPaused(q) && now >= q.pausedUntil) return openPauseExpired();
  if (!isHalted(q) && !q.endShown && now >= q.endsAt) { q.endShown = true; saveState(); return openTimeUp(); }
  if (!isHalted(q) && q.nextEventAt && now >= q.nextEventAt) openEvent();
}, 500);

window.merc = { state: () => state, save: saveState, render: () => render() };
render();
</script>
</body>
</html>
